services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: simplcommerce-graft-sqlserver
    ports:
      - "1436:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - MSSQL_SA_PASSWORD=9Pq7vX4gR2mL8sT@5Wn1
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"9Pq7vX4gR2mL8sT@5Wn1\" -C -Q \"SELECT 1\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  db-seed:
    image: mcr.microsoft.com/mssql-tools
    container_name: simplcommerce-graft-db-seed
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./Database/graft-core-seed.sql:/seed.sql:ro
    environment:
      - SQLCMDPASSWORD=9Pq7vX4gR2mL8sT@5Wn1
    entrypoint: ["/opt/mssql-tools/bin/sqlcmd", "-b", "-S", "sqlserver", "-U", "sa", "-i", "/seed.sql"]
    restart: "no"

  simplcommerce-core-grafthost:
    image: simplcommerce/core-grafthost:1.0
    build:
      context: .
      dockerfile: SimplCommerce.Core.GraftHost/Dockerfile
    depends_on:
      db-seed:
        condition: service_completed_successfully
    ports:
      - "8290:80"
      - "8291:81"
    environment:
      - SIMPLCOMMERCE_CORE_CN=Server=sqlserver,1433;User Id=sa;Password=9Pq7vX4gR2mL8sT@5Wn1;Database=SimplCommerceCoreGraft;TrustServerCertificate=true;Encrypt=False;
